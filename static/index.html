<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵台 · 本地书架</title>
<link rel="icon" href="/static/img/lingtai.png">
<link rel="apple-touch-icon" href="/static/img/lingtai.png">
<link rel="stylesheet" href="/static/css/app.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
</head>
<body data-view="shelf">

<!-- ============================ 书架视图 ============================ -->
<main id="view-shelf" class="view">
  <header class="topbar">
    <div class="brand">
      <img src="/static/img/lingtai.png" alt="灵台" class="brand-logo" aria-hidden="true">
      <div class="brand-text">
        <h1>灵台</h1>
        <p>本地书架</p>
      </div>
    </div>

    <div class="topbar-tools">
      <div class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search-input" type="text" placeholder="搜索书名 / 作者" autocomplete="off">
      </div>
      <select id="filter-format" class="select" title="按格式筛选">
        <option value="">全部格式</option>
      </select>
      <select id="sort-by" class="select" title="排序">
        <option value="recent">最近阅读</option>
        <option value="title">书名</option>
        <option value="added">添加时间</option>
        <option value="custom">自定义</option>
      </select>
      <button id="btn-view-mode" class="icon-btn" title="切换书架样式">
        <svg id="view-icon-grid" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        <svg id="view-icon-shelf" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M2 6h20M2 14h20M2 20h20"/><path d="M5 6v8M9 6v8M14 6v8M18 6v8"/></svg>
      </button>
      <button id="btn-library" class="icon-btn" title="书库">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M9 7h7M9 11h7"/></svg>
      </button>
      <input type="file" id="file-input" accept=".pdf,.epub,.txt,.mobi,.azw3,.fb2,.cbz,.cbr,.docx" hidden multiple>
      <button id="btn-upload" class="icon-btn" title="导入书籍">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
      </button>
      <button id="btn-refresh" class="icon-btn" title="刷新书架">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>
      </button>
      <button id="btn-theme-toggle" class="icon-btn" title="切换深色/浅色">
        <svg id="theme-icon-dark" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg id="theme-icon-light" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
      <button id="btn-notes-center" class="icon-btn" title="笔记中心">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      </button>
      <button id="btn-trash" class="icon-btn" title="回收站">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
    </div>
  </header>

  <section class="shelf-wrap">
    <aside id="category-sidebar" class="category-sidebar"></aside>
    <div class="shelf-main">
      <div id="shelf" class="shelf" aria-live="polite"></div>

      <div id="trash-bin" class="trash-bin" hidden>
        <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
        <span>拖到此处删除</span>
      </div>
      <div id="empty-state" class="empty-state" hidden>
        <div class="empty-art" aria-hidden="true">
          <svg viewBox="0 0 80 80" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.4">
            <rect x="10" y="14" width="12" height="52" rx="1.5"/>
            <rect x="26" y="20" width="12" height="46" rx="1.5"/>
            <rect x="42" y="12" width="12" height="54" rx="1.5"/>
            <path d="M58 66V24c4-3 9-3 12 0v42z"/>
          </svg>
        </div>
        <h2>书架空空如也</h2>
        <p>把电子书放进 <code>books</code> 文件夹，或点击上方导入按钮。</p>
        <div class="empty-formats">
          <span>PDF</span><span>EPUB</span><span>TXT</span><span>CBZ</span>
          <span class="dim">MOBI · AZW3 · FB2 · DOCX · CBR（仅收录，部分暂不支持在线阅读）</span>
        </div>
        <button id="btn-empty-refresh" class="btn-primary">刷新书架</button>
      </div>
    </div>
  </section>
</main>

<!-- ============================ 阅读器视图 ============================ -->
<main id="view-reader" class="view" hidden>
  <header class="reader-bar">
    <button id="reader-back" class="icon-btn" title="返回书架">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="reader-title">
      <span id="reader-title" class="reader-title-name">—</span>
      <span id="reader-fmt" class="fmt-badge"></span>
    </div>
  </header>

  <div class="reader-stage">
    <button id="page-prev" class="page-nav prev" title="上一页" aria-label="上一页">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div id="reader-area" class="reader-area"></div>
    <button id="page-next" class="page-nav next" title="下一页" aria-label="下一页">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <footer class="reader-foot collapsed">
    <div class="progress-row">
      <span id="page-info" class="page-info">—</span>
      <div class="progress-track">
        <input id="progress-slider" type="range" min="0" max="100" value="0" step="0.1" aria-label="阅读进度">
      </div>
      <span id="progress-pct" class="progress-pct">0%</span>
    </div>
    <div class="tools-row">
      <div class="reader-tools-bar">
        <button id="btn-mode" class="tool-btn" title="切换翻页方向" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
          <span>模式</span>
        </button>
        <button id="btn-toc" class="tool-btn" title="目录" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h12"/></svg>
          <span>目录</span>
        </button>
        <button id="btn-notes" class="tool-btn" title="笔记">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          <span>笔记</span>
        </button>
        <button id="btn-zoom-out" class="tool-btn" title="缩小" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
          <span>缩小</span>
        </button>
        <span id="zoom-level" class="zoom-level" hidden>100%</span>
        <button id="btn-zoom-in" class="tool-btn" title="放大" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          <span>放大</span>
        </button>
        <button id="btn-fit" class="tool-btn" title="适合宽度" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
          <span>适应</span>
        </button>
        <button id="btn-theme" class="tool-btn" title="切换主题" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <span>主题</span>
        </button>
        <button id="btn-auto" class="tool-btn" title="自动阅读" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <span>自动</span>
        </button>
      </div>
    </div>
  </footer>
</main>

<!-- ============================ 笔记面板 ============================ -->
<aside id="notes-panel" class="notes-panel" hidden>
  <div class="notes-header">
    <h2>笔记</h2>
    <span id="notes-book-name" class="notes-book-name"></span>
    <button id="notes-close" class="icon-btn notes-close" title="关闭">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="notes-editor">
    <textarea id="notes-input" placeholder="在此写下你的感想…" rows="4"></textarea>
    <button id="notes-save" class="btn-primary notes-save-btn">保存笔记</button>
  </div>
  <div id="notes-list" class="notes-list" aria-live="polite"></div>
  <div id="notes-empty" class="notes-empty" hidden>还没有笔记，开始记录你的阅读感想吧。</div>
</aside>

<!-- ============================ 目录面板 ============================ -->
<aside id="toc-panel" class="notes-panel toc-panel" hidden>
  <div class="notes-header">
    <h2>目录</h2>
    <span id="toc-book-name" class="notes-book-name"></span>
    <button id="toc-close" class="icon-btn notes-close" title="关闭">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div id="toc-list" class="toc-list" aria-live="polite"></div>
  <div id="toc-empty" class="notes-empty" hidden>此书没有目录信息。</div>
</aside>

<!-- 阅读器子模板：不支持格式 -->
<template id="tpl-unsupported">
  <div class="unsupported">
    <div class="unsupported-icon">
      <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
    </div>
    <h3>暂不支持在线阅读此格式</h3>
    <p class="unsupported-fmt"></p>
    <p class="unsupported-tip">建议将其转换为 <strong>EPUB</strong> 或 <strong>PDF</strong> 后放入 <code>books</code> 文件夹。</p>
  </div>
</template>

<!-- AI 设置弹窗 -->
<div id="ai-settings" class="modal-overlay" hidden>
  <div class="modal-card">
    <div class="modal-header">
      <h2>AI 助手设置</h2>
      <button id="ai-set-close" class="icon-btn" title="关闭">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <label class="form-label">API 地址 (Endpoint)
        <input id="ai-set-endpoint" type="text" placeholder="https://api.deepseek.com/v1" class="form-input">
        <span class="form-hint">填到 /v1 为止, 程序会自动拼 /chat/completions; 用第三方中转也填这里</span>
      </label>
      <label class="form-label">API Key
        <input id="ai-set-key" type="password" placeholder="输入 API Key" class="form-input">
      </label>
      <label class="form-label">模型名称 (Model)
        <input id="ai-set-model" type="text" placeholder="deepseek-flash" class="form-input">
      </label>
    </div>
    <div class="modal-footer">
      <button id="ai-set-save" class="btn-primary">保存</button>
    </div>
  </div>
</div>

<!-- 书库弹窗: 从外部电子书仓库导入书籍 -->
<div id="library-modal" class="modal-overlay" hidden>
  <div class="modal-card" style="max-width:660px;">
    <div class="modal-header">
      <h2>书库</h2>
      <button id="lib-close" class="icon-btn" title="关闭">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body" style="max-height:64vh;overflow-y:auto;">
      <label class="form-label">书库路径
        <input id="lib-path" type="text" class="form-input"
               placeholder="指向电子书仓库的目录, 例如 …/ebook-library">
      </label>
      <div class="lib-toolbar">
        <span id="lib-status" class="lib-status"></span>
        <button id="lib-save" class="btn-secondary btn-sm">保存路径</button>
        <button id="lib-refresh" class="btn-secondary btn-sm">刷新</button>
      </div>
      <div id="lib-list" class="lib-list"></div>
    </div>
  </div>
</div>

<!-- ============================ 笔记中心 ============================ -->
<div id="notes-center-modal" class="modal-overlay" hidden>
  <div class="modal-card" style="max-width:720px;">
    <div class="modal-header">
      <h2>笔记中心</h2>
      <button id="notes-center-close" class="icon-btn" title="关闭">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body" id="notes-center-body" style="max-height:70vh;overflow-y:auto;">
      <div id="notes-center-list" class="notes-center-list"></div>
      <div id="notes-center-empty" class="notes-empty" hidden>还没有任何笔记。</div>
    </div>
  </div>
</div>

<!-- 第三方库（本地化，离线可用） -->
<script src="/static/vendor/jszip.min.js"></script>
<script src="/static/vendor/pdf.min.js"></script>
<script src="/static/vendor/epub.min.js"></script>
<!-- 应用入口 -->
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
